# Pins the JVM that Gradle itself runs on.
#
# Read by the Gradle launcher before any build script is compiled, so it takes effect
# earlier than anything expressible in a .kts file.
#
# Why it is pinned: the Kotlin DSL compiler bundled in Gradle 8.11.1 (Kotlin 2.0.20), the
# Kotlin Gradle Plugin 2.0.21 and AGP 8.7.3 all fail on JDK 25 and newer — the version
# string is rejected by their embedded parser, and the build dies with a bare "25.0.4".
# Java 21 is the newest JDK this toolchain fully supports, and it is what Android Studio
# bundles as its JetBrains Runtime.
toolchainVersion=21
