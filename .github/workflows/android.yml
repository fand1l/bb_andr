name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must be 21: the Kotlin DSL compiler bundled in Gradle 8.11.1, KGP 2.0.21 and AGP
      # 8.7.3 all reject JDK 25 version strings. gradle/gradle-daemon-jvm.properties pins the
      # same version, so a mismatch here fails loudly rather than mysteriously.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -eu
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # The rules engine is plain Kotlin with no Android dependencies, so it runs here
      # without an emulator. Kept as its own step so a rules failure is obvious in the log.
      - name: Rules engine tests
        run: ./gradlew :engine:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Signed with the auto-generated debug key, so this artifact installs on a phone as-is.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
          if-no-files-found: ignore

  release:
    name: Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Lifted into env because the secrets context is not available to step conditions.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -eu
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Optional. Without a keystore the build still runs and produces an unsigned APK, which
      # will not install — the summary below says so rather than leaving you to work it out.
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Note whether the APK is installable
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Release APK signed with the repository keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Unsigned release APK"
              echo
              echo "No \`ANDROID_KEYSTORE_BASE64\` secret is configured, so this APK cannot be"
              echo "installed. Add these repository secrets to get a signed build:"
              echo "\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apks=(app/build/outputs/apk/release/*.apk)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${apks[@]}" \
            || gh release upload "$GITHUB_REF_NAME" "${apks[@]}" --clobber
